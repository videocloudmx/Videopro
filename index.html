<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .contenedor {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }
        video {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            background: #000;
        }
        .nota {
            color: #ccc;
            text-align: center;
            margin-top: 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <!-- Reproductor de video sin autoplay, con sonido disponible -->
        <video controls playsinline preload="auto">
            <source src="https://qu.ax/7Zqtr.mp4" type="video/mp4">
            Tu navegador no soporta la etiqueta de video.
        </video>
        <div class="nota">
            Haz clic en el video para reproducirlo.
        </div>
    </div>

    <!-- Script del anuncio popunder (se carga al final para no bloquear el video) -->
    <script>
        (function(s){
            s.dataset.zone = '10273232';
            s.src = 'https://al5sm.com/tag.min.js';
        })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
    </script>
</body>
</html>
